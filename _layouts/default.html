<!doctype html>
<html lang="en">
  <head>
    <style>
      /* Permanently prevent horizontal scrolling */
      html,
      body {
        overflow-x: hidden !important;
        width: 100%;
      }
    </style>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title | default: site.title }}</title>

    <!-- Tisa Theme Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Supercharged Tisa Theme Fonts (Includes Bold 600 and 700!) -->
    <!-- Loads Garamond (for headings), DM Serif (for logo), and Montserrat (for text) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Serif+Display&family=Montserrat:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"
    />
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
  </head>

  <body>
    <!-- THE NAVIGATION BAR -->
    <style>
      /* =========================================
     NAVBAR HOVER DROPDOWN
  ========================================= */
      .nav-dropdown {
        position: relative;
        display: flex;
        align-items: center;
        /* Forces this wrapper to span the exact height of your navbar */
        height: 62px;
      }

      /* The Dropdown Box */
      .nav-dropdown-menu {
        position: absolute;
        /* Because the wrapper is 62px tall, 100% is perfectly flush with the bottom edge! */
        top: 103%;
        left: 50%;
        transform: translateX(-50%); /* Keeps it centered */
        background-color: #ffffff;
        min-width: 150px;
        padding: 0.5rem 0;
        border: 1px solid #e5e5e5;
        border-top: none; /* Merges seamlessly with the navbar */
        box-shadow: none;

        display: flex;
        flex-direction: column;

        /* Start hidden */
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.25s ease,
          visibility 0.25s ease;
        z-index: 2000;
      }

      /* The Reveal (Just a clean fade-in now so it stays locked to the edge) */
      .nav-dropdown:hover .nav-dropdown-menu {
        opacity: 1;
        visibility: visible;
      }

      /* The Links Inside */
      .nav-dropdown-item {
        display: block;
        padding: 0.4rem 1.5rem;
        font-family: var(--font-sans) !important;
        font-size: 0.85rem !important;
        color: var(--text-dark, #1c1c1c) !important;
        text-transform: none !important;
        letter-spacing: 0.1em !important;
        text-decoration: none !important;
        border-bottom: none !important;
        text-align: left;
        transition: opacity 0.2s ease;
      }

      .nav-dropdown-item:hover {
        opacity: 0.5;
      }

      /* The subtle partial-width line at the top */
      .nav-dropdown-menu::before {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%); /* Keeps the line perfectly centered */
        width: 38%; /* Adjust this percentage to make the line wider or shorter! */
        height: 5px;
        background-color: #e5e5e5; /* Matches your border color */
      }
      /* The elegant downward chevron arrow */
      .nav-dropdown .nav-link::after {
        content: "";
        display: inline-block;
        margin-left: 8px;
        width: 6px;
        height: 6px;
        /* Draws just the bottom and right edges of a square */
        border-right: 1.5px solid currentColor;
        border-bottom: 1.5px solid currentColor;
        /* Tilts the square 45 degrees to make it point down */
        transform: translateY(-2px) rotate(45deg);
        transition: transform 0.3s ease;
      }

    </style>

    <nav class="navbar editorial-header">
      <div
        class="container d-flex flex-row justify-content-between align-items-center"
      >
        <a class="navbar-brand mb-0" href="{{ '/' | relative_url }}"
          >Gleda Ho</a
        >

        <div class="navbar-nav d-flex flex-row gap-4 align-items-center">
          <!-- DROPDOWN WRAPPER -->
          <div class="nav-dropdown">
            <a class="nav-link" href="{{ '/collections/' | relative_url }}"
              >Collections</a
            >

            <!-- THE MENU -->
            <div class="nav-dropdown-menu">
              <a
                href="{{ '/collections/iceland/' | relative_url }}"
                class="nav-dropdown-item"
                >Iceland</a
              >
              <a
                href="{{ '/collections/finland/' | relative_url }}"
                class="nav-dropdown-item"
                >Finland</a
              >
              <a
                href="{{ '/collections/guatemala/' | relative_url }}"
                class="nav-dropdown-item"
                >Guatemala</a
              >
              <a
                href="{{ '/collections/ireland/' | relative_url }}"
                class="nav-dropdown-item"
                >Ireland</a
              >
            </div>
          </div>

          <a class="nav-link" href="{{ '/map/' | relative_url }}">Map</a>
          <a class="nav-link" href="{{ '/about/' | relative_url }}">About</a>
        </div>
      </div>
    </nav>

    <main
      class="{% if page.full_width %}container-fluid p-0{% else %}container py-4{% endif %}"
    >
      {{ content }}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
    {% if page.load_map_js %}
    <script src="{{ '/assets/js/map.js' | relative_url }}"></script>
    {% endif %}

    <!-- Your Lightbox HTML... -->
    <div id="lightbox" class="lightbox hidden panel-open">
      <div class="lightbox-main">
        <button
          id="lightbox-prev"
          class="lightbox-arrow lightbox-ui"
          type="button"
          aria-label="Previous image"
        >
          &#10094;
        </button>
        <button
          id="lightbox-left-zone"
          class="lightbox-zone"
          type="button"
          aria-label="Previous image"
        ></button>
        <div id="lightbox-stage" class="lightbox-stage">
          <img
            id="lightbox-image-a"
            class="lightbox-image active"
            src=""
            alt=""
          />
          <img id="lightbox-image-b" class="lightbox-image" src="" alt="" />
        </div>
        <button
          id="lightbox-right-zone"
          class="lightbox-zone"
          type="button"
          aria-label="Next image"
        ></button>
        <button
          id="lightbox-next"
          class="lightbox-arrow lightbox-ui"
          type="button"
          aria-label="Next image"
        >
          &#10095;
        </button>
      </div>
      <aside class="lightbox-panel">
        <div class="lightbox-panel-content">
          <p id="lightbox-caption"></p>
          <div class="lightbox-details">More details will go here.</div>
        </div>
      </aside>
      <div class="lightbox-controls lightbox-ui">
        <button
          id="lightbox-close"
          class="lightbox-control"
          type="button"
          aria-label="Close"
        >
          ×
        </button>
        <button
          id="lightbox-panel-toggle"
          class="lightbox-control"
          type="button"
          aria-label="Toggle information panel"
        >
          <i class="bi bi-info-circle"></i>
        </button>
      </div>
    </div>
    <script src="{{ '/assets/js/lightbox.js' | relative_url }}"></script>
  </body>
</html>
